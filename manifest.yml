app:
  id: ari:cloud:ecosystem::app/1aef7bb3-351c-48b2-af86-96ca9367752c
  runtime:
    name: nodejs24.x

modules:
  macro:
    - key: session-debrief
      title: Session debrief
      description: Lap times, stints, tyre wear and pit stops for a race session, with
        findings you can file in Jira.
      resource: debrief
      render: native
      resolver:
        function: resolver
      layout: block
      config:
        resource: debrief-config
        render: native
        title: Choose a session
        openOnInsert: true

  rovo:agent:
    - key: race-engineer
      name: Race engineer
      description: Answers questions about a race session's timing data and files
        findings as Jira issues.
      prompt: |
        You are a race engineer reviewing a session's timing data with the team.

        Data:
        - Every number comes from the actions. Pit Wall reads public timing data from OpenF1; a team would use its own telemetry. Say so once if asked.
        - On a page with a Session debrief, leave sessionKey out. Otherwise call find-session with the season, race and session, and pass its sessionKey on. Never guess a sessionKey.
        - If an action answers with a problem, do what it says. If the page's session isn't found, call find-session with the season and Grand Prix in the page title.

        Answers:
        - Only state numbers an action returned in this conversation. If they don't cover it, say what is missing.
        - Name the rule behind a finding, for example "1.5 s over the team's median".
        - For lost time in a stint, call stint-analysis and use wearAboveCompoundMedian, paceVsField and gapChange as given. Describe a lap only by its note; a lap with no note is clean.
        - For where a driver would have rejoined, call pit-stops with the driver and pitLap. Call it an estimate and give the position, the cars ahead and behind with gaps, and the pit loss. If the driver did pit on that lap, compare.
        - Seconds with the action's decimals. Drivers as three-letter codes in plain text, never with @.
        - Short: the finding first, then two or three numbers.

        Jira:
        - Create an issue only when asked. Confirm the finding and the project key, then call create-finding, then give the issue key and link.
      conversationStarters:
        - What stood out in this session?
        - Which pit stops were slow, and by how much?
        - Where would NOR have rejoined if he had pitted on lap 30?
        - File the slowest pit stop as a Jira issue
      actions:
        - find-session
        - session-summary
        - stint-analysis
        - pit-stops
        - create-finding

  action:
    - key: find-session
      name: Find session
      function: fn-find-session
      actionVerb: GET
      description: Finds a session's key from a season, a Grand Prix name, country or
        circuit, and a session name. Use it before the other actions when the
        user names a race.
      inputs:
        year:
          title: Season
          type: integer
          required: true
          description: The season, for example 2025.
        race:
          title: Grand Prix
          type: string
          required: true
          description: Part of the Grand Prix name, the country or the circuit, for
            example Italian, Italy or Monza.
        session:
          title: Session
          type: string
          required: false
          description: Race, Qualifying, Sprint, Practice 1, Practice 2 or Practice 3.
            Race if not given.
    - key: session-summary
      name: Session summary
      function: fn-session-summary
      actionVerb: GET
      description: The session's order at the flag, best laps, pit stop counts and
        every finding with its numbers. Use it for overview questions.
      inputs:
        sessionKey:
          title: Session key
          type: integer
          required: false
          description: From find-session. Leave out to use the session debriefed on the
            current page.
    - key: stint-analysis
      name: Stint analysis
      function: fn-stint-analysis
      actionVerb: GET
      description: One driver's stints, or one stint lap by lap with tyre wear, the
        field's pace on the same compound and the gap to the leader. Use it to
        explain where a driver lost time.
      inputs:
        sessionKey:
          title: Session key
          type: integer
          required: false
          description: From find-session. Leave out to use the session debriefed on the
            current page.
        driver:
          title: Driver
          type: string
          required: true
          description: Car number, three-letter code or surname, for example 23, ALB or
            Albon.
        stint:
          title: Stint
          type: integer
          required: false
          description: Stint number, 1 for the first. Leave out to list the driver's stints.
    - key: pit-stops
      name: Pit stops
      function: fn-pit-stops
      actionVerb: GET
      description: Every pit stop against its median and how far over it was. With a
        driver and a pitLap, also where that driver would have rejoined had they pitted
        at the end of that lap. For pit stop and pit window questions.
      inputs:
        sessionKey:
          title: Session key
          type: integer
          required: false
          description: From find-session. Leave out to use the session debriefed on the
            current page.
        driver:
          title: Driver
          type: string
          required: false
          description: Only this driver's stops. Car number, code or surname.
        pitLap:
          title: Pit lap
          type: integer
          required: false
          description: With a driver, the lap they would pit at the end of, for a rejoin
            estimate. For example 30.
    - key: create-finding
      name: Create finding issue
      function: fn-create-finding
      actionVerb: CREATE
      description: Creates a Jira issue for one finding from session-summary, with its
        numbers and a link back to the debrief page. Only use it when the user
        asks for an issue.
      inputs:
        findingId:
          title: Finding
          type: string
          required: true
          description: The finding's id from session-summary, for example stop-NOR-46.
        projectKey:
          title: Jira project key
          type: string
          required: false
          description: The Jira project to file in, for example PW. Leave out to use the
            project set on the debrief page.
        sessionKey:
          title: Session key
          type: integer
          required: false
          description: From find-session. Leave out to use the session debriefed on the
            current page.

  function:
    - key: resolver
      handler: index.handler
    - key: fn-find-session
      handler: index.findSession
    - key: fn-session-summary
      handler: index.sessionSummary
    - key: fn-stint-analysis
      handler: index.stintAnalysis
    - key: fn-pit-stops
      handler: index.pitStops
    - key: fn-create-finding
      handler: index.createFinding

resources:
  - key: debrief
    path: src/frontend/debrief.tsx
  - key: debrief-config
    path: src/frontend/config.tsx

permissions:
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
  external:
    fetch:
      backend:
        - address: https://api.openf1.org
